summary: Replace flagged media files through Sonarr and Radarr
description: >-
  Runs on a schedule. Takes files Duck asked to replace, a few at a time and
  only while the NAS has room: moves each to its library's .quarantine folder,
  searches, and has the new file checked with a full decode. The original stays
  in quarantine until Duck removes it in the review app.
