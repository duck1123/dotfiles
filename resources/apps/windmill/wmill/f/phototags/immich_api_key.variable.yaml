value: ""
is_secret: true
description: >-
  Immich API key for the photo tag scripts, created as Duck's user (Immich
  tags belong to a user), from secrets/k8s.enc.yaml `immich.phototagsApiKey`.
  Permissions: tag.read, tag.create, tag.update, tag.asset, asset.read; add
  tag.delete only when the orphan prune needs it. Separate from
  `immich.adminApiKey` (homepage widget). The real value is never stored
  here; it's seeded by the windmill-sync ArgoCD hook job from
  clusters/dev/apps/windmill.nix's `secretVariables`.
